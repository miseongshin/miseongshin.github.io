<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta property="og:image" content="https://shinmiseong.com/statics/image/common/og-title.png" />
	<meta property="og:title" content="신미성 / Shin Miseong" />
	<meta property="og:description" content="기록과 작업들 / Notes, work, and experiments." />
	<meta property="og:url" content="https://shinmiseong.com/" />
	<meta property="og:type" content="website" />
    <title>신미성 · Shin Miseong</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@700;900&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffb400'><path d='M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z'/></svg>">
    <style>
        :root {
            --primary-color: #333;
            --accent-color: #ffb400;
            --text-muted: #888;
            --icon-black: #222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Nanum Gothic', sans-serif;
            background-color: #ffffff;
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 0;
        }

        /* --- 애니메이션 효과 (위치 고정) --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header, .portfolio-container, .info-box {
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        .lang-switch {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 100;
        }
        .lang-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .lang-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

        .header {
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }
        .main-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 62px;
            font-weight: 900;
            letter-spacing: 8px;
            display: inline-block;
            margin-bottom: 4px;
            color: var(--primary-color);
            transform: scale(1.1, 0.85);
            line-height: 1;
        }
        .role-line {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 0;
        }
        .contact-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .contact-group a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            word-break: break-all; /* 모바일 주소 잘림 방지 */
        }
        .contact-group a:hover { color: var(--primary-color); text-decoration: underline; }

        .tistory-logo {
            width: 18px;
            height: 18px;
            background-color: var(--icon-black);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .portfolio-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 400px;
            margin: 0 auto;
        }

        .center-img {
            position: absolute;
            top: 160px;
            left: calc(50% + 80px);   /* 왼쪽 기술 스택 칸이 넓어 그림을 오른쪽으로 */
            transform: translateX(-50%);
            width: 200px;
            z-index: 5;
            transition: filter 0.3s ease;
        }
        .center-img:hover { filter: drop-shadow(0 0 10px rgba(255,180,0,0.2)); }

        .info-box {
            width: 280px;
            position: absolute;
            transition: all 0.3s ease;
        }
        .info-box:hover { color: #000; }
        .info-box:hover .project-title { border-bottom-color: var(--accent-color); }

        .year {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px; font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 5px;
            display: block;
        }
        .project-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; display: block; border-bottom: 2px solid #eee; padding-bottom: 5px; transition: border-color 0.3s ease; }
        .details { list-style: none; font-size: 13px; color: var(--text-muted); line-height: 2; }
        .details a { color: var(--primary-color); font-weight: 600; text-decoration: none; }
        .item-git-icon { font-size: 14px; margin-right: 8px; color: var(--primary-color); vertical-align: middle; }
        /* --- 기술 스택 칸 --- */
        .stack-title { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
        /* 아랫줄(정적 호스팅 · 기술 스택)은 제품 이름이 아니라 검정 */
        .is-head-style .tc-title { color: var(--primary-color); }
        .stack-rule { border: 0; border-top: 2px solid #1f1f1f; margin: 0 0 14px; }
        .stack-row { display: grid; grid-template-columns: 108px 1fr; gap: 12px; font-size: 13px; line-height: 1.9; margin-bottom: 8px; }
        .stack-key { font-weight: 700; color: var(--primary-color); white-space: nowrap; }
        /* 영어 항목 이름이 길어 칸을 넓힌다 (Operations & Troubleshooting) */
        html[lang="en"] .stack-row { grid-template-columns: 200px 1fr; }
        .stack-val { font-size: 13px; color: var(--text-muted); }

        .details .site-link { margin-left: 10px; font-weight: 400; color: var(--text-muted); text-decoration: underline; text-decoration-color: #ddd; text-underline-offset: 3px; }
        .details .site-link:hover { color: #d18f00; text-decoration-color: #f0a500; }

        /* --- 첫째 줄 두 칸 (웹사이트 / 어플) --- */
        .tc-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 14px;
        }
        .tc-title { font-size: 22px; font-weight: 700; color: #f0a500; letter-spacing: -0.01em; }
        .tc-year { font-size: 13px; color: #8f8a80; white-space: nowrap; }
        .tc-rule {
            border: 0;
            border-top: 2px solid #1f1f1f;
            margin: 12px 0 0;
            transition: border-top-color 0.3s ease;
        }
        .info-box:hover .tc-rule { border-top-color: #f0a500; }

        .tc-links { display: flex; align-items: center; justify-content: space-between; gap: 22px; margin-top: 18px; }
        .tc-links + .tc-links { margin-top: 10px; }
        .tc-link {
            font-size: 14px;
            color: var(--primary-color);
            text-decoration: underline;
            text-decoration-color: #ddd;
            text-underline-offset: 4px;
            transition: color 0.2s ease, text-decoration-color 0.2s ease;
        }
        .tc-link.is-primary { font-weight: 600; }
        .tc-second { display: inline-flex; align-items: center; gap: 10px; }
        .tc-store { font-size: 15px; color: var(--primary-color); line-height: 1; transition: color 0.2s ease; }
        .tc-store:hover { color: #d18f00; }
        .tc-link:hover { color: #d18f00; text-decoration-color: #f0a500; }


        @media (min-width: 1025px) {
            /* 첫째 줄 : 왼쪽 = 웹사이트(p2), 오른쪽 = 어플(p4) — 가운데로 붙여서 나란히 */
            .pos-left-top { top: 20px; left: 50%; margin-left: -300px; text-align: right; }
            .pos-right-top { top: 20px; left: 50%; margin-left: 20px; text-align: left; }
            /* 둘째 줄 */
            .pos-left-bottom { top: 160px; left: calc(50% - 500px); width: 440px; text-align: left; }
            .pos-right-bottom { top: 160px; right: calc(50% - 500px); width: 280px; text-align: left; }
            .pos-center-top { top: 0; left: 50%; transform: translateX(-50%); text-align: center; }
        }

        /* --- 맨 아래 카피라이트 --- */
        .site-foot {
            width: 100%;
            margin-top: 60px;
            padding: 0 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            animation: fadeIn 0.8s ease-in-out forwards;
        }
        @media (max-width: 1024px) {
            body { justify-content: flex-start; padding: 60px 20px; }
            .header { margin-bottom: 40px; }
            .main-title { font-size: 44px; transform: scale(1, 0.9); }
            .role-line { font-size: 12px; }
            .contact-group { font-size: 12px; gap: 10px; flex-direction: column; }
            .portfolio-container { display: flex; flex-direction: column; align-items: center; height: auto; }
            /* 모바일 순서 : 웹사이트 → 어플 → 나머지, 캐릭터 그림은 맨 아래 */
            #p2 { order: 1; }
            #p4 { order: 2; }
            #p5 { order: 3; }   /* 기술 스택 */
            #p1 { order: 4; }   /* 정적 호스팅 */
            .center-img { order: 99; position: relative; width: 260px; margin: 40px 0; transform: none; left: auto; top: auto; }
            /* 모바일에서는 모든 칸을 왼쪽 정렬로 통일 */
            .info-box { position: static; width: 100%; max-width: 500px; margin-bottom: 40px; text-align: left; border-bottom: 1px solid #f0f0f0; padding-bottom: 20px; }
            .details { display: block; text-align: left; }
            .stack-row { grid-template-columns: 108px 1fr; }
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="lang-btn" data-lang-btn="ko">KO</button>
        <button class="lang-btn" data-lang-btn="en">EN</button>
    </div>

    <div class="header">
        <h1 id="name-title" class="main-title"></h1>
        <p id="name-subtitle" class="role-line"></p>
        <div class="contact-group">
            <a id="header-git-link" href="https://github.com/miseongshin" target="_blank">
                <i class="fa-brands fa-github" style="font-size: 20px; color: var(--primary-color);"></i>
                <span id="git-text">github.com/miseongshin</span>
            </a>
            <a href="https://freewebsite1028.tistory.com/" target="_blank">
                <span class="tistory-logo">T</span> <span>freewebsite1028.tistory.com</span>
            </a>
        </div>
    </div>

    <div class="portfolio-container">
        <img src="./statics/image/common/mainIll.png" alt="Character" class="center-img">
        <div id="p1" class="info-box is-head-style pos-right-bottom"></div>
        <div id="p2" class="info-box is-top-cell pos-left-top"></div>
        <div id="p3" class="info-box pos-center-top"></div>
        <div id="p4" class="info-box is-top-cell pos-right-top"></div>
        <div id="p5" class="info-box is-stack-cell pos-left-bottom"></div>
    </div>

    <footer class="site-foot">
        <p>&copy; 2018&ndash;<span id="foot-year">2026</span> shinmiseong. All rights reserved.</p>
    </footer>


    <script>
        const translations = {
            ko: {
				title: "신미성 - 작업과 기록들",
                name: "신미성",
                role: "백엔드 개발자 · Java / Spring",
                gitDisplay: "github.com/miseongshin",
                projects: {
                    // 첫째 줄 : 왼쪽 = 웹사이트, 오른쪽 = 어플
                    p2: { year: "2026.06 ~", title: "꿀방울", labelDesign: "", design: "꿀방울 소개", designUrl: "https://honeysaltlove.com/ko/app/honey-drops/", storeUrl: "https://play.google.com/store/apps/details?id=com.honeysalt.sleep", labelLive: "", live: "포트폴리오 보기", liveUrl: "/portfolio/honeydrops/", gitUrl: "#" },
                    p4: { year: "2026.01 ~", title: "단짠♥", labelDesign: "", design: "바로보기", designUrl: "https://honeysaltlove.com/", labelLive: "", live: "포트폴리오 보기", liveUrl: "/portfolio/honeysaltlove/", gitUrl: "#" },
                    // 둘째 줄
                    p1: { year: "2018.06 ~", title: "정적 호스팅 페이지", sites: [
                            { name: "소안도미소펜션", gitUrl: "https://github.com/soanmiso/soanmiso.github.io", url: "https://soanmiso.com/", linkText: "바로보기" },
                            { name: "라온필하모닉합창단", gitUrl: "https://github.com/raonphilchior", url: "https://raonphil.com/", linkText: "바로보기" }
                        ] },
                    p5: { title: "기술 스택", rows: [
                            { key: "백엔드", val: "Java (8 · 17) · Spring Framework · Spring Boot 2 · 3" },
                            { key: "데이터베이스", val: "Oracle · PostgreSQL · MySQL · MariaDB · MSSQL · SQLite" },
                            { key: "프런트", val: "JavaScript · jQuery · Vue 3" },
                            { key: "운영 · 분석", val: "레거시 분석 · 원인 추적 · 장애 대응 · LLM 연동" },
                            { key: "형상관리", val: "Git · SVN" }
                        ] }
                },
            },
            en: {
				title: "Shin Miseong - Notes, work, and experiments.",
                name: "SHIN MISEONG",
                role: "Backend Developer · Java / Spring",
                gitDisplay: "miseongshin.github.io",
                projects: {
                    // Row 1 : left = website, right = app
                    p2: { year: "2026.06 ~", title: "Honey Drops", labelDesign: "", design: "About Honey Drops", designUrl: "https://honeysaltlove.com/en/app/honey-drops/", storeUrl: "https://play.google.com/store/apps/details?id=com.honeysalt.sleep", labelLive: "", live: "View Portfolio", liveUrl: "/portfolio/honeydrops/", gitUrl: "#" },
                    p4: { year: "2026.01 ~", title: "HoneySalt♥", labelDesign: "", design: "Visit", designUrl: "https://honeysaltlove.com/", labelLive: "", live: "View Portfolio", liveUrl: "/portfolio/honeysaltlove/", gitUrl: "#" },
                    // Row 2
                    p1: { year: "2018.06 ~", title: "Static Hosting Site", sites: [
                            { name: "Soanmiso Pension", gitUrl: "https://github.com/soanmiso/soanmiso.github.io", url: "https://soanmiso.com/", linkText: "Visit" },
                            { name: "Raon Philharmonic Choir", gitUrl: "https://github.com/raonphilchior", url: "https://raonphil.com/", linkText: "Visit" }
                        ] },
                    p5: { title: "Tech Stack", rows: [
                            { key: "Backend", val: "Java (8 · 17) · Spring Framework · Spring Boot 2 · 3" },
                            { key: "Database", val: "Oracle · PostgreSQL · MySQL · MariaDB · MSSQL · SQLite" },
                            { key: "Frontend", val: "JavaScript · jQuery · Vue 3" },
                            { key: "Operations & Troubleshooting", val: "Legacy analysis · Root-cause tracing · Incident response · LLM integration" },
                            { key: "Version control", val: "Git · SVN" }
                        ] }
                },
            }
        };

        // 첫째 줄 칸의 링크 하나
        // 내 사이트 안 페이지로 갈 때는 지금 보고 있는 언어를 주소에 실어 보낸다
        function withLang(url) {
            // 링크가 없는 칸(정적 호스팅 · 기술 스택)도 지나가므로 빈 값을 먼저 거른다
            if (!url) return url;
            return url.startsWith('/') ? url + '?lang=' + currentLang : url;
        }

        function tcLink(url, text, primary) {
            if (!text || !url || url === '#') return '';
            // 내 사이트 안 페이지는 같은 탭에서, 바깥 주소는 새 탭에서
            const attrs = url.startsWith('/') ? `href="${withLang(url)}"` : `href="${url}" target="_blank"`;
            return `<a class="tc-link${primary ? ' is-primary' : ''}" ${attrs}>${text}</a>`;
        }

        let currentLang = 'ko';

        function updateContent(lang) {
            currentLang = lang;
            const data = translations[lang];
            document.getElementById('name-title').textContent = data.name;
            document.getElementById('name-subtitle').innerHTML = data.role;
            document.getElementById('git-text').textContent = data.gitDisplay;

            for (let i = 1; i <= 5; i++) {
                const container = document.getElementById('p' + i);
                if (container) container.style.display = 'none';
            }

            Object.keys(data.projects).forEach(id => {
                const project = data.projects[id];
                const container = document.getElementById(id);
                if (!container) return;

                container.style.display = 'block';

                // 기술 스택 칸
                if (container.classList.contains('is-stack-cell')) {
                    container.innerHTML = `<span class="stack-title">${project.title}</span>
                        <hr class="stack-rule">
                        ${project.rows.map(r => `<div class="stack-row"><span class="stack-key">${r.key}</span><span class="stack-val">${r.val}</span></div>`).join('')}`;
                    return;
                }

                // 첫째 줄 두 칸은 다른 디자인 : 제목 옆에 연도, 아래 수평선, 링크 한 줄
                if (container.classList.contains('is-top-cell')) {
                    const storeHtml = project.storeUrl
                        ? `<a class="tc-store" href="${project.storeUrl}" target="_blank" aria-label="Google Play"><i class="fa-brands fa-google-play"></i></a>`
                        : '';
                    const links = tcLink(project.liveUrl, project.live, true)
                        + `<span class="tc-second">${tcLink(project.designUrl, project.design, false)}${storeHtml}</span>`;

                    container.innerHTML = `<div class="tc-head">
                            <span class="tc-title">${project.title}</span>
                            <span class="tc-year">${project.year}</span>
                        </div>
                        <hr class="tc-rule">
                        <div class="tc-links">${links}</div>`;
                    return;
                }

                let designGitHtml = project.designGitUrl ? `<a href="${project.designGitUrl}" target="_blank" class="item-git-icon"><i class="fa-brands fa-github"></i></a>` : '';
                let designSite = project.designSiteUrl ? ` <a href="${project.designSiteUrl}" target="_blank" class="site-link">${project.designSiteText}</a>` : '';
                let designHtml = project.design ? `<li>${project.labelDesign ? project.labelDesign + ' ' : ''}${designGitHtml}<a href="${project.designUrl}" target="_blank">${project.design}</a>${designSite}</li>` : '';
                let gitIconHtml = project.gitUrl && project.gitUrl !== "#" ? `<a href="${project.gitUrl}" target="_blank" class="item-git-icon"><i class="fa-brands fa-github"></i></a>` : '';
                let liveAnchor = `<a href="${withLang(project.liveUrl)}" target="_blank">${project.live}</a>`;
                let siteAnchor = project.siteUrl ? ` <a href="${project.siteUrl}" target="_blank" class="site-link">${project.siteText}</a>` : '';
                let liveHtml = project.live ? `<li>${project.labelLive ? project.labelLive + ' ' : ''}${gitIconHtml}${liveAnchor}${siteAnchor}</li>` : '';

                // 위 카드와 같은 머리·링크 클래스를 그대로 쓴다
                if (container.classList.contains('is-head-style')) {
                    const rows = project.sites.map(site => `<div class="tc-links">
                            <span class="tc-second">
                                <a href="${site.gitUrl}" target="_blank" class="item-git-icon"><i class="fa-brands fa-github"></i></a>
                                <a class="tc-link is-primary" href="${site.gitUrl}" target="_blank">${site.name}</a>
                            </span>
                            <a class="tc-link" href="${site.url}" target="_blank">${site.linkText}</a>
                        </div>`).join('');

                    container.innerHTML = `<div class="tc-head">
                            <span class="tc-title">${project.title}</span>
                            <span class="tc-year">${project.year}</span>
                        </div>
                        <hr class="tc-rule">${rows}`;
                    return;
                }

                container.innerHTML = `<span class="year">${project.year}</span><span class="project-title">${project.title}</span><ul class="details">${designHtml}${liveHtml}</ul>`;
            });
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.langBtn === lang));
            document.title = translations[lang].title;
            document.documentElement.lang = lang;

            // URL 파라미터 업데이트
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', lang);
            window.history.pushState({}, '', newUrl);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => updateContent(btn.dataset.langBtn)));


        // URL 파라미터 확인 및 초기 언어 설정
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        const browserLang = navigator.language.includes('en') ? 'en' : 'ko';
        const initialLang = (langParam === 'ko' || langParam === 'en') ? langParam : browserLang;

        updateContent(initialLang);

        // 카피라이트 연도는 해가 바뀌면 알아서 따라간다
        document.getElementById('foot-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
