<html lang="ko">
<head>

	<meta property="og:title" content="신미성 / Shin Miseong" />
	<meta property="og:description" content="기록과 작업들 / Notes, work, and experiments." />
	<meta property="og:url" content="https://shinmiseong.com/" />
	<meta property="og:type" content="website" />
    <title>신미성 · Shin Miseong</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@700;900&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #333;
            --accent-color: #ffb400;
            --text-muted: #888;
            --icon-black: #222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Nanum Gothic', sans-serif;
            background-color: #ffffff;
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 0;
        }

        /* --- 애니메이션 효과 (위치 고정) --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header, .portfolio-container, .info-box {
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        .lang-switch {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 100;
        }
        .lang-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .lang-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

        .header {
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }
        .main-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 62px;
            font-weight: 900;
            letter-spacing: 8px;
            display: inline-block;
            margin-bottom: 4px;
            color: var(--primary-color);
            transform: scale(1.1, 0.85);
            line-height: 1;
        }
        .role-line {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 0;
        }
        .contact-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .contact-group a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            word-break: break-all; /* 모바일 주소 잘림 방지 */
        }
        .contact-group a:hover { color: var(--primary-color); text-decoration: underline; }

        .tistory-logo {
            width: 18px;
            height: 18px;
            background-color: var(--icon-black);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .portfolio-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 400px;
            margin: 0 auto;
        }

        .center-img {
            position: absolute;
            top: 160px;
            left: calc(50% + 80px);   /* 왼쪽 기술 스택 칸이 넓어 그림을 오른쪽으로 */
            transform: translateX(-50%);
            width: 200px;
            z-index: 5;
            transition: filter 0.3s ease;
        }
        .center-img:hover { filter: drop-shadow(0 0 10px rgba(255,180,0,0.2)); }

        .info-box {
            width: 280px;
            position: absolute;
            transition: all 0.3s ease;
        }
        .info-box:hover { color: #000; }
        .info-box:hover .project-title { border-bottom-color: var(--accent-color); }

        .year {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px; font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 5px;
            display: block;
        }
        .project-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; display: block; border-bottom: 2px solid #eee; padding-bottom: 5px; transition: border-color 0.3s ease; }
        .details { list-style: none; font-size: 13px; color: var(--text-muted); line-height: 2; }
        .details a { color: var(--primary-color); font-weight: 600; text-decoration: none; }
        .item-git-icon { font-size: 14px; margin-right: 8px; color: var(--primary-color); vertical-align: middle; }
        /* --- 기술 스택 칸 --- */
        .stack-title { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
        /* 아랫줄(정적 호스팅 · 기술 스택)은 제품 이름이 아니라 검정 */
        .is-head-style .tc-title { color: var(--primary-color); }
        .stack-rule { border: 0; border-top: 2px solid #1f1f1f; margin: 0 0 14px; }
        .stack-row { display: grid; grid-template-columns: 108px 1fr; gap: 12px; font-size: 13px; line-height: 1.9; margin-bottom: 8px; }
        .stack-key { font-weight: 700; color: var(--primary-color); white-space: nowrap; }
        .stack-val { font-size: 13px; color: var(--text-muted); }

        .details .site-link { margin-left: 10px; font-weight: 400; color: var(--text-muted); text-decoration: underline; text-decoration-color: #ddd; text-underline-offset: 3px; }
        .details .site-link:hover { color: #d18f00; text-decoration-color: #f0a500; }

        /* --- 첫째 줄 두 칸 (웹사이트 / 어플) --- */
        .tc-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 14px;
        }
        .tc-title { font-size: 22px; font-weight: 700; color: #f0a500; letter-spacing: -0.01em; }
        .tc-year { font-size: 13px; color: #8f8a80; white-space: nowrap; }
        .tc-rule {
            border: 0;
            border-top: 2px solid #1f1f1f;
            margin: 12px 0 0;
            transition: border-top-color 0.3s ease;
        }
        .info-box:hover .tc-rule { border-top-color: #f0a500; }

        .tc-links { display: flex; align-items: center; justify-content: space-between; gap: 22px; margin-top: 18px; }
        .tc-links + .tc-links { margin-top: 10px; }
        .tc-link {
            font-size: 14px;
            color: var(--primary-color);
            text-decoration: underline;
            text-decoration-color: #ddd;
            text-underline-offset: 4px;
            transition: color 0.2s ease, text-decoration-color 0.2s ease;
        }
        .tc-link.is-primary { font-weight: 600; }
        .tc-second { display: inline-flex; align-items: center; gap: 10px; }
        .tc-store { font-size: 15px; color: var(--primary-color); line-height: 1; transition: color 0.2s ease; }
        .tc-store:hover { color: #d18f00; }
        .tc-link:hover { color: #d18f00; text-decoration-color: #f0a500; }

        /* --- 포트폴리오 팝업 --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.is-open { display: flex; }

        .modal-box {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 860px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            animation: fadeIn 0.25s ease-in-out forwards;
        }
        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 34px; height: 34px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
        }
        .modal-close:hover { border-color: var(--primary-color); color: var(--primary-color); }

        .modal-slogan { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .modal-title { font-size: 26px; font-weight: 700; margin-bottom: 28px; }
        .modal-title .heart { color: #cd100f; }

        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        .modal-card { border: 1px solid #eee; border-radius: 10px; padding: 24px; }
        .modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
        .modal-card .body { font-size: 13px; line-height: 1.9; color: var(--text-muted); }
        .modal-card .body b { display: block; color: var(--accent-color); font-size: 13px; margin-top: 14px; }
        .modal-card .body b:first-child { margin-top: 0; }

        .modal-shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
        .modal-shots img { width: 100%; display: block; border: 1px solid #eee; border-radius: 8px; }

        /* 포스터(가로) + 오프닝 영상(세로) — 높이를 맞추고 폭은 비율대로 */
        .modal-media {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 16px;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid #f2f2f2;
        }
        .modal-media img,
        .modal-media video {
            height: 300px;
            width: auto;
            max-width: 100%;
            display: block;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #000;
        }

        .modal-downloads { margin-top: 28px; }
        .modal-dl-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .modal-badge { display: inline-flex; line-height: 0; transition: opacity 0.2s ease; }
        .modal-badge img { height: 44px; width: auto; display: block; }
        .modal-badge:hover { opacity: 0.8; }

        @media (max-width: 700px) {
            .modal-box { padding: 28px 20px; }
            .modal-grid { grid-template-columns: 1fr; gap: 20px; }
            .modal-media img,
            .modal-media video { height: auto; width: 100%; }
            .modal-title { font-size: 21px; margin-bottom: 20px; }
        }

        @media (min-width: 1025px) {
            /* 첫째 줄 : 왼쪽 = 웹사이트(p2), 오른쪽 = 어플(p4) — 가운데로 붙여서 나란히 */
            .pos-left-top { top: 20px; left: 50%; margin-left: -300px; text-align: right; }
            .pos-right-top { top: 20px; left: 50%; margin-left: 20px; text-align: left; }
            /* 둘째 줄 */
            .pos-left-bottom { top: 160px; left: calc(50% - 500px); width: 440px; text-align: left; }
            .pos-right-bottom { top: 160px; right: calc(50% - 500px); width: 280px; text-align: left; }
            .pos-center-top { top: 0; left: 50%; transform: translateX(-50%); text-align: center; }
        }

        @media (max-width: 1024px) {
            body { justify-content: flex-start; padding: 60px 20px; }
            .header { margin-bottom: 40px; }
            .main-title { font-size: 44px; transform: scale(1, 0.9); }
            .role-line { font-size: 12px; }
            .contact-group { font-size: 12px; gap: 10px; flex-direction: column; }
            .portfolio-container { display: flex; flex-direction: column; align-items: center; height: auto; }
            /* 모바일 순서 : 웹사이트 → 어플 → 나머지, 캐릭터 그림은 맨 아래 */
            #p2 { order: 1; }
            #p4 { order: 2; }
            #p5 { order: 3; }   /* 기술 스택 */
            #p1 { order: 4; }   /* 정적 호스팅 */
            .center-img { order: 99; position: relative; width: 260px; margin: 40px 0; transform: none; left: auto; top: auto; }
            /* 모바일에서는 모든 칸을 왼쪽 정렬로 통일 */
            .info-box { position: static; width: 100%; max-width: 500px; margin-bottom: 40px; text-align: left; border-bottom: 1px solid #f0f0f0; padding-bottom: 20px; }
            .details { display: block; text-align: left; }
            .stack-row { grid-template-columns: 108px 1fr; }
        }
    </style>
</head>

                    p2: { year: "2026.06 ~", title: "honeydrops", labelDesign: "", design: "About Honey Drops", designUrl: "https://honeysaltlove.com/en/app/honey-drops/", storeUrl: "https://play.google.com/store/apps/details?id=com.honeysalt.sleep", labelLive: "", live: "View Portfolio", liveUrl: "#modal-drops", gitUrl: "#" },
                    p4: { year: "2026.01 ~", title: "HoneySalt♥", labelDesign: "", design: "Visit", designUrl: "https://honeysaltlove.com/", labelLive: "", live: "View Portfolio", liveUrl: "#modal-hsl", gitUrl: "#" },
                    // Row 2
                    p1: { year: "2018.06 ~", title: "Static Hosting Site", sites: [
                            { name: "Soanmiso Pension", gitUrl: "https://github.com/soanmiso/soanmiso.github.io", url: "https://soanmiso.com/", linkText: "Visit" },
                            { name: "Raon Philharmonic Choir", gitUrl: "https://github.com/raonphilchior", url: "https://raonphil.com/", linkText: "Visit" }

                    p5: { title: "Tech Stack", rows: [

                            { key: "Ops · Analysis", val: "Legacy analysis · Root-cause tracing · Incident response · LLM integration" },
                            { key: "Version control", val: "Git · SVN" }
                        ] }
                },
                modals: {
                    hsl: {
                        slogan: "Structuring thoughts for a clearer life.",
                        title: 'HONEY SALT<span class="heart">LOVE</span> PORTFOLIO',
                        c1title: "Project Overview",
                        c1body: `<b>Background &amp; Vision</b>
                            Providing a visual structuring tool for fragmented ideas to enhance user decision-making and practical productivity.
                            <b>Core Concept</b>
                            A UX-centric interface designed to minimize cognitive load and maximize focus.
                            <b>Business Goal</b>
                            MVP validation through official launch and implementation of a sustainable monetization model.`,
                        c2title: "Tech Stack &amp; Roadmap",
                        c2body: `<b>Tech Stack</b>
                            Vue.js, Spring Boot 3(Java 21), PostgreSQL, and AI Integration
                            <b>Phase 1 Milestone</b>
                            Jan 2026 ~ Scalable server architecture design and implementation of Mandal-art visualization module.
                            <b>Development Focus</b>
                            An action-oriented, web-based tool for structured thinking.`
                    },
                    drops: {
                        slogan: "A self-care app for building small habits of looking after yourself.",
                        title: 'honeydrops',
                        c1title: "Project Overview",
                        c1body: `<b>Background &amp; Vision</b>
                            When you don't know where to start, it picks one very small action that fits how you feel right now.
                            <b>Core Concept</b>
                            Pick one of 7 moods (Angry · Burnout · Calm · Anxious · Low · Busy Mind · Sleepy) and get a 1–5 minute action.
                            <b>Key Features</b>
                            Short routines like Move, Tidy and Massage, star rewards, and stats &amp; calendar of your moods and actions.`,
                        c2title: "Tech Stack &amp; Roadmap",
                        c2body: `<b>Tech Stack</b>
                            React Native (Expo) · SQLite · Firebase (Analytics · Crashlytics · Firestore) · Korean / English / Japanese
                            <b>Screens</b>
                            Four tabs — Self-Care, Mind Tools, My Records, Settings
                            <b>Timeline</b>
                            Jun 19, 2026 start → Jul 16 core features done → Jul 21 Play Store registration &amp; internal testing → Jul 29 rebranded to honeydrops → Aug 11 day/night themes and localization`,
                        shots: [
                            "./statics/image/honeydrops/en/01-pm1-mood-1.jpg",
                            "./statics/image/honeydrops/en/02-sm1-main-normal.jpg",
                            "./statics/image/honeydrops/en/05-sl1-records-1.jpg"
                        ],
                        downloads: [
                            { img: "./statics/image/honeydrops/badge_ko.png", url: "https://honeysaltlove.com/ko/app/honey-drops/", alt: "Google Play에서 다운로드" },
                            { img: "./statics/image/honeydrops/badge_en.png", url: "https://honeysaltlove.com/en/app/honey-drops/", alt: "Get it on Google Play" },
                            { img: "./statics/image/honeydrops/badge_ja.png", url: "https://honeysaltlove.com/ja/app/honey-drops/", alt: "Google Play で手に入れよう" }
                        ],
                        media: {
                            poster: "https://honeysaltlove.com/images/menu/app/app_honey_drops_en.png",
                            video: "https://honeysaltlove.com/video/en/honey-drops-opening.mp4",
                            videoPoster: "https://honeysaltlove.com/video/en/honey-drops-opening.jpg"
                        }
                    }
                },
            }
        };

        // 첫째 줄 칸의 링크 하나. url 이 "#modal-XXX" 면 새 창 대신 팝업을 연다.
        function tcLink(url, text, primary) {
            if (!text || !url || url === '#') return '';
            const key = url.startsWith('#modal-') ? url.slice(7) : '';
            const attrs = key ? `href="#" data-modal="${key}"` : `href="${url}" target="_blank"`;
            return `<a class="tc-link${primary ? ' is-primary' : ''}" ${attrs}>${text}</a>`;
        }

        function updateContent(lang) {
            const data = translations[lang];
            document.getElementById('name-title').textContent = data.name;
            document.getElementById('name-subtitle').innerHTML = data.role;
            document.getElementById('git-text').textContent = data.gitDisplay;

            for (let i = 1; i <= 5; i++) {
                const container = document.getElementById('p' + i);
                if (container) container.style.display = 'none';
            }

            Object.keys(data.projects).forEach(id => {
                const project = data.projects[id];
                const container = document.getElementById(id);
                if (!container) return;

                container.style.display = 'block';

                // 기술 스택 칸
                if (container.classList.contains('is-stack-cell')) {
                    container.innerHTML = `<span class="stack-title">${project.title}</span>
                        <hr class="stack-rule">
                        ${project.rows.map(r => `<div class="stack-row"><span class="stack-key">${r.key}</span><span class="stack-val">${r.val}</span></div>`).join('')}`;
                    return;
                }

                // 첫째 줄 두 칸은 다른 디자인 : 제목 옆에 연도, 아래 수평선, 링크 한 줄
                if (container.classList.contains('is-top-cell')) {
                    const storeHtml = project.storeUrl
                        ? `<a class="tc-store" href="${project.storeUrl}" target="_blank" aria-label="Google Play"><i class="fa-brands fa-google-play"></i></a>`
                        : '';
                    const links = tcLink(project.liveUrl, project.live, true)
                        + `<span class="tc-second">${tcLink(project.designUrl, project.design, false)}${storeHtml}</span>`;

                    container.innerHTML = `<div class="tc-head">
                            <span class="tc-title">${project.title}</span>
                            <span class="tc-year">${project.year}</span>
                        </div>
                        <hr class="tc-rule">
                        <div class="tc-links">${links}</div>`;
                    return;
                }

                let designGitHtml = project.designGitUrl ? `<a href="${project.designGitUrl}" target="_blank" class="item-git-icon"><i class="fa-brands fa-github"></i></a>` : '';
                let designSite = project.designSiteUrl ? ` <a href="${project.designSiteUrl}" target="_blank" class="site-link">${project.designSiteText}</a>` : '';
                let designHtml = project.design ? `<li>${project.labelDesign ? project.labelDesign + ' ' : ''}${designGitHtml}<a href="${project.designUrl}" target="_blank">${project.design}</a>${designSite}</li>` : '';
                let gitIconHtml = project.gitUrl && project.gitUrl !== "#" ? `<a href="${project.gitUrl}" target="_blank" class="item-git-icon"><i class="fa-brands fa-github"></i></a>` : '';
                // liveUrl 이 "#modal-XXX" 이면 새 창 대신 팝업을 연다
                let modalKey = project.liveUrl && project.liveUrl.startsWith('#modal-') ? project.liveUrl.slice(7) : '';
                let liveAnchor = modalKey
                    ? `<a href="#" data-modal="${modalKey}">${project.live}</a>`
                    : `<a href="${project.liveUrl}" target="_blank">${project.live}</a>`;
                let siteAnchor = project.siteUrl ? ` <a href="${project.siteUrl}" target="_blank" class="site-link">${project.siteText}</a>` : '';
                let liveHtml = project.live ? `<li>${project.labelLive ? project.labelLive + ' ' : ''}${gitIconHtml}${liveAnchor}${siteAnchor}</li>` : '';

                // 위 카드와 같은 머리·링크 클래스를 그대로 쓴다
                if (container.classList.contains('is-head-style')) {
                    const rows = project.sites.map(site => `<div class="tc-links">
                            <span class="tc-second">
                                <a href="${site.gitUrl}" target="_blank" class="item-git-icon"><i class="fa-brands fa-github"></i></a>
                                <a class="tc-link is-primary" href="${site.gitUrl}" target="_blank">${site.name}</a>
                            </span>
                            <a class="tc-link" href="${site.url}" target="_blank">${site.linkText}</a>
                        </div>`).join('');

                    container.innerHTML = `<div class="tc-head">
                            <span class="tc-title">${project.title}</span>
                            <span class="tc-year">${project.year}</span>
                        </div>
                        <hr class="tc-rule">${rows}`;
                    return;
                }

                container.innerHTML = `<span class="year">${project.year}</span><span class="project-title">${project.title}</span><ul class="details">${designHtml}${liveHtml}</ul>`;
            });
            // 팝업이 열려 있으면 해당 언어로 다시 그린다
            currentLang = lang;
            if (openModalKey) renderModal(openModalKey);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.langBtn === lang));
            document.title = translations[lang].title;
            document.documentElement.lang = lang;

            // URL 파라미터 업데이트
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', lang);
            window.history.pushState({}, '', newUrl);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => updateContent(btn.dataset.langBtn)));

        // --- 팝업 열기 / 닫기 ---
        let currentLang = 'ko';
        let openModalKey = '';

        // 그림·영상이 안 열리면 그 자리를 비운다. 남은 게 없으면 칸째로 없앤다.
        function hideBroken(el) {
            const box = el.closest('.modal-media') || el.parentElement;
            (el.closest('.modal-badge') || el).remove();
            if (box && box.classList.contains('modal-media') && !box.children.length) box.remove();
        }

        function renderModal(key) {
            const m = translations[currentLang].modals[key];
            if (!m) return false;

            const shots = m.shots && m.shots.length
                ? `<div class="modal-shots">${m.shots.map(s => `<img src="${s}" alt="${key}" loading="lazy">`).join('')}</div>`
                : '';

            // 다운로드 배지 (한 · 영 · 일)
            const badge = m.downloads && m.downloads.length
                ? `<div class="modal-downloads">
                        <div class="modal-dl-row">${m.downloads.map(d =>
                            `<a class="modal-badge" href="${d.url}" target="_blank"><img src="${d.img}" alt="${d.alt}" onerror="hideBroken(this)"></a>`
                        ).join('')}</div>
                    </div>`
                : '';

            // 포스터 · 오프닝 영상 (honeysaltlove.com 에서 가져옴)
            const media = m.media
                ? `<div class="modal-media">${[
                        m.media.poster ? `<img src="${m.media.poster}" alt="${m.title}" loading="lazy" onerror="hideBroken(this)">` : '',
                        m.media.video ? `<video src="${m.media.video}" poster="${m.media.videoPoster || ''}" controls autoplay muted loop playsinline preload="auto" onerror="hideBroken(this)"></video>` : ''
                    ].join('')}</div>`
                : '';

            document.getElementById('modal-content').innerHTML = `
                <p class="modal-slogan">${m.slogan}</p>
                <h2 class="modal-title">${m.title}</h2>
                <div class="modal-grid">
                    <div class="modal-card"><h3>${m.c1title}</h3><div class="body">${m.c1body}</div></div>
                    <div class="modal-card"><h3>${m.c2title}</h3><div class="body">${m.c2body}</div></div>
                </div>${shots}${media}${badge}`;

            // 소리 없이 바로 재생 (자동재생은 muted 여야 브라우저가 막지 않는다)
            const vid = document.querySelector('#modal-content video');
            if (vid) {
                vid.muted = true;
                vid.play().catch(() => {});
            }
            return true;
        }

        function openModal(key) {
            if (!renderModal(key)) return;
            openModalKey = key;
            document.getElementById('modal-root').classList.add('is-open');
        }
        function closeModal() {
            openModalKey = '';
            document.getElementById('modal-root').classList.remove('is-open');
            // 닫으면 영상도 멈춘다
            document.querySelectorAll('#modal-content video').forEach(v => v.pause());
        }

        // 프로젝트 박스는 나중에 그려지므로 문서 단위로 위임 처리
        document.addEventListener('click', e => {
            const trigger = e.target.closest('[data-modal]');
            if (trigger) { e.preventDefault(); openModal(trigger.dataset.modal); return; }
            // 어두운 배경이나 닫기 버튼 클릭 시 닫기
            if (e.target.classList.contains('modal-overlay') || e.target.closest('.modal-close')) closeModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        // URL 파라미터 확인 및 초기 언어 설정
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        const browserLang = navigator.language.includes('en') ? 'en' : 'ko';
        const initialLang = (langParam === 'ko' || langParam === 'en') ? langParam : browserLang;

        updateContent(initialLang);
    </script>
</body>
